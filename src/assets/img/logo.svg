<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Gradiente de Superfície Escura -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111915"/>
      <stop offset="100%" stop-color="#080d0a"/>
    </linearGradient>

    <!-- Gradiente da Borda FinTech -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Gradiente Esmeralda Neon -->
    <linearGradient id="neonEmerald" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Efeito de Brilho / Glow -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Radial Glow de Fundo -->
    <radialGradient id="centerGlow" cx="24" cy="24" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base com Cantos Arredondados e Borda de Vidro -->
  <rect width="48" height="48" rx="13" fill="url(#bgGrad)"/>
  <rect x="0.6" y="0.6" width="46.8" height="46.8" rx="12.4" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- Halo de Luz Central -->
  <circle cx="24" cy="24" r="16" fill="url(#centerGlow)"/>

  <!-- Guias de Precisão (Viewfinder Ticks nos 4 Cantos) -->
  <path d="M 12 16 L 12 12 L 16 12" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <path d="M 36 16 L 36 12 L 32 12" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <path d="M 12 32 L 12 36 L 16 36" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <path d="M 36 32 L 36 36 L 32 36" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>

  <!-- Eixos Sutis de Mira / Tracking -->
  <line x1="9" y1="24" x2="39" y2="24" stroke="#10b981" stroke-width="1" stroke-dasharray="2 3" opacity="0.25"/>
  <line x1="24" y1="9" x2="24" y2="39" stroke="#10b981" stroke-width="1" stroke-dasharray="2 3" opacity="0.25"/>

  <!-- Símbolo Central: Cruz Geométrica de Alta Definição com Glow -->
  <g filter="url(#emeraldGlow)">
    <!-- Barra Horizontal -->
    <rect x="14" y="22" width="20" height="4" rx="2" fill="url(#neonEmerald)"/>
    <!-- Barra Vertical -->
    <rect x="22" y="14" width="4" height="20" rx="2" fill="url(#neonEmerald)"/>
    <!-- Núcleo de Precisão (Diamante Branco/Menta no Centro) -->
    <circle cx="24" cy="24" r="2.2" fill="#ecfdf5"/>
  </g>
</svg>
