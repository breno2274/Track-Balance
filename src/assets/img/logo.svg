<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Fundo sutil e fosco -->
  <rect width="32" height="32" rx="8" fill="#0d1411" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1"/>
  
  <!-- Linha Vertical (Balance) -->
  <line x1="16" y1="8" x2="16" y2="24" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Linha Horizontal (Track) -->
  <line x1="8" y1="16" x2="24" y2="16" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Ponto central de equilíbrio -->
  <circle cx="16" cy="16" r="1.5" fill="#34d399"/>
</svg>
