<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <!-- Fundo sutil com cantos arredondados -->
  <rect width="40" height="40" rx="10" fill="#0d1411" stroke="#1b2823" stroke-width="1.5"/>
  
  <!-- Linhas guias de grade sutis -->
  <line x1="8" y1="20" x2="32" y2="20" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="20" y1="8" x2="20" y2="32" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1" stroke-dasharray="2 2"/>
  
  <!-- Cruz central esmeralda neon -->
  <line x1="12" y1="20" x2="28" y2="20" stroke="#10b981" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="20" y1="12" x2="20" y2="28" stroke="#10b981" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Ponto central de precisão -->
  <circle cx="20" cy="20" r="2.5" fill="#34d399"/>
</svg>
