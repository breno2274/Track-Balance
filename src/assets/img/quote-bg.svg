<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a100d"/>
      <stop offset="100%" stop-color="#050806"/>
    </linearGradient>
    <linearGradient id="mistGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.15)"/>
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0)"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bgGrad)"/>
  
  <!-- Montanhas distantes -->
  <polygon points="0,300 80,180 180,240 280,150 400,270 400,300" fill="#0d1612" opacity="0.6"/>
  
  <!-- Montanhas frontais -->
  <polygon points="0,300 120,200 220,280 310,190 400,260 400,300" fill="#080e0b"/>
  
  <!-- Névoa esmeralda no rodapé -->
  <rect y="180" width="400" height="120" fill="url(#mistGrad)"/>
</svg>
